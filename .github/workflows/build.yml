name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_targets:
        description: "构建目标平台"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos

permissions:
  contents: write

env:
  APP_NAME: AICat
  CARGO_INCREMENTAL: 0
  VITE_COMFLY_BASE_URL: https://ai.comfly.chat

defaults:
  run:
    working-directory: ai-canvas

jobs:
  # ─── Windows (x86_64) ────────────────────────────────────
  build-windows:
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON('["all","windows"]'), github.event.inputs.build_targets)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-canvas/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ai-canvas/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ai-canvas
          tagName: ${{ github.ref_name }}
          releaseName: "${{ env.APP_NAME }} ${{ github.ref_name }}"
          releaseBody: "See the assets below to download the installer."
          releaseDraft: true
          prerelease: false

  # ─── macOS Universal (Intel + Apple Silicon) ─────────────
  build-macos:
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON('["all","macos"]'), github.event.inputs.build_targets)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-canvas/package-lock.json

      - name: Setup Rust (universal)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ai-canvas/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (universal)
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Patch ATS & codesign & repackage DMG
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/${{ env.APP_NAME }}.app"
          PLIST="$APP/Contents/Info.plist"

          echo "=== App bundle contents ==="
          ls -la "$APP/Contents/MacOS/"
          echo "=== Info.plist before patch ==="
          cat "$PLIST"

          echo "=== Patching ATS ==="
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$PLIST"

          echo "=== Info.plist after patch ==="
          cat "$PLIST"

          echo "=== Signing nested components ==="
          if [ -d "$APP/Contents/Frameworks" ]; then
            find "$APP/Contents/Frameworks" -type f -perm +111 -exec codesign --force --sign - {} \; 2>/dev/null || true
            find "$APP/Contents/Frameworks" -name "*.framework" -exec codesign --force --sign - {} \; 2>/dev/null || true
            find "$APP/Contents/Frameworks" -name "*.dylib" -exec codesign --force --sign - {} \; 2>/dev/null || true
          fi

          echo "=== Signing all binaries in MacOS/ ==="
          find "$APP/Contents/MacOS" -type f -perm +111 -exec codesign --force --sign - {} \;

          echo "=== Signing app bundle ==="
          codesign --force --sign - "$APP"
          codesign --verify --verbose "$APP"

          echo "=== Re-creating DMG ==="
          VERSION=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | sed 's/.*: *"\(.*\)".*/\1/')
          DMG_NAME="${{ env.APP_NAME }}_${VERSION}_universal.dmg"
          DMG_DIR="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          rm -f "$DMG_DIR"/*.dmg
          hdiutil create -volname "${{ env.APP_NAME }}" -srcfolder "$APP" -ov -format UDZO "$DMG_DIR/$DMG_NAME"
          ls -lh "$DMG_DIR/$DMG_NAME"

      - name: Smoke test – launch app on macOS runner
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/${{ env.APP_NAME }}.app"
          BIN="$APP/Contents/MacOS/ai-canvas"

          echo "=== Binary info ==="
          file "$BIN"
          lipo -info "$BIN"

          echo "=== Launching binary (timeout 8s) ==="
          timeout 8 "$BIN" >smoke_stdout.log 2>smoke_stderr.log || EXIT_CODE=$?
          echo "Exit code: ${EXIT_CODE:-0}"

          echo "=== stdout ==="
          cat smoke_stdout.log || true
          echo "=== stderr ==="
          cat smoke_stderr.log || true

          echo "=== startup.log ==="
          STARTUP_LOG="$HOME/Library/Application Support/com.ai-canvas.desktop/startup.log"
          if [ -f "$STARTUP_LOG" ]; then
            cat "$STARTUP_LOG"
          else
            echo "(not found)"
          fi

          echo "=== Crash reports ==="
          find ~/Library/Logs/DiagnosticReports -name "*ai*" -o -name "*AICat*" 2>/dev/null | head -5 || echo "(none)"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG found"
            exit 1
          fi
          echo "Uploading $DMG"
          gh release create "$TAG" --draft --title "${{ env.APP_NAME }} $TAG" --notes "See the assets below to download the installer." 2>/dev/null || true
          gh release upload "$TAG" "$DMG" --clobber
