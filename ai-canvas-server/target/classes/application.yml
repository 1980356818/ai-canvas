server:
  port: 8090

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/aicat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

aicat:
  jwt:
    secret: ${JWT_SECRET:AiCatServerDefaultJwtSecretKeyMustBeAtLeast256BitsLong!!}
    full-expire-hours: 168
    restricted-expire-hours: 24
