name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_targets:
        description: "构建目标平台"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos

permissions:
  contents: write

env:
  APP_NAME: AICat
  CARGO_INCREMENTAL: 0
  VITE_COMFLY_BASE_URL: https://ai.comfly.org

jobs:
  # ─── Windows (x86_64) ────────────────────────────────────
  build-windows:
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON('["all","windows"]'), github.event.inputs.build_targets)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "${{ env.APP_NAME }} ${{ github.ref_name }}"
          releaseBody: "See the assets below to download the installer."
          releaseDraft: true
          prerelease: false

  # ─── macOS Universal (single job, no artifacts) ──────────
  build-macos:
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON('["all","macos"]'), github.event.inputs.build_targets)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (both targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (aarch64)
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Build Tauri (x86_64)
        run: npm run tauri build -- --target x86_64-apple-darwin

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create universal binary & pkg
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          ARM_APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/${{ env.APP_NAME }}.app"
          INTEL_APP="src-tauri/target/x86_64-apple-darwin/release/bundle/macos/${{ env.APP_NAME }}.app"
          UNIVERSAL_APP="${{ env.APP_NAME }}.app"

          cp -R "$ARM_APP" "$UNIVERSAL_APP"

          echo "=== Merging main executable ==="
          lipo -create \
            "$ARM_APP/Contents/MacOS/${{ env.APP_NAME }}" \
            "$INTEL_APP/Contents/MacOS/${{ env.APP_NAME }}" \
            -output "$UNIVERSAL_APP/Contents/MacOS/${{ env.APP_NAME }}"

          echo "=== Merging dylibs (if any) ==="
          find "$ARM_APP/Contents" -name "*.dylib" -type f | while read arm_dylib; do
            rel="${arm_dylib#$ARM_APP/}"
            intel_dylib="$INTEL_APP/$rel"
            if [ -f "$intel_dylib" ]; then
              echo "  Merging $rel"
              lipo -create "$arm_dylib" "$intel_dylib" -output "$UNIVERSAL_APP/$rel"
            fi
          done

          echo "=== Verifying universal binary ==="
          file "$UNIVERSAL_APP/Contents/MacOS/${{ env.APP_NAME }}"
          lipo -info "$UNIVERSAL_APP/Contents/MacOS/${{ env.APP_NAME }}"

          echo "=== Patching ATS ==="
          PLIST="$UNIVERSAL_APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$PLIST"

          echo "=== Codesigning ==="
          codesign --force --deep --sign - "$UNIVERSAL_APP"
          codesign --verify --verbose "$UNIVERSAL_APP"

          echo "=== Creating pkg installer ==="
          PKG="${{ env.APP_NAME }}_${APP_VERSION}_universal.pkg"

          pkgbuild \
            --component "$UNIVERSAL_APP" \
            --install-location /Applications \
            --identifier "com.ai-canvas.desktop" \
            --version "${APP_VERSION}" \
            "$PKG"

          ls -lh "$PKG"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          TAG="v${APP_VERSION}"
          PKG="${{ env.APP_NAME }}_${APP_VERSION}_universal.pkg"
          gh release create "$TAG" --draft --title "${{ env.APP_NAME }} $TAG" --notes "See the assets below to download the installer." 2>/dev/null || true
          gh release upload "$TAG" "$PKG" --clobber
