name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_targets:
        description: "构建目标平台"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos
          - macos-intel
          - macos-arm

permissions:
  contents: write

env:
  APP_NAME: AICat
  CARGO_INCREMENTAL: 0
  VITE_COMFLY_API_KEY: sk-V3CT1nzrBVT39hZezULUjczUEy9e3jiCZCK8qBTRbbbfOZB6
  VITE_COMFLY_BASE_URL: https://ai.comfly.chat

jobs:
  # ─── Windows (x86_64) ────────────────────────────────────
  build-windows:
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON('["all","windows"]'), github.event.inputs.build_targets)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "${{ env.APP_NAME }} ${{ github.ref_name }}"
          releaseBody: "See the assets below to download the installer."
          releaseDraft: true
          prerelease: false

  # ─── macOS Apple Silicon (aarch64) ───────────────────────
  build-macos-arm:
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON('["all","macos","macos-arm"]'), github.event.inputs.build_targets)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (aarch64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Patch ATS & codesign & repackage
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/${{ env.APP_NAME }}.app"
          PLIST="$APP/Contents/Info.plist"
          echo "=== Patching ATS in $PLIST ==="
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$PLIST"
          echo "=== Signing $APP ==="
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          echo "=== Re-creating DMG ==="
          DMG="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/${{ env.APP_NAME }}_0.1.0_aarch64.dmg"
          rm -f "$DMG"
          hdiutil create -volname "${{ env.APP_NAME }}" -srcfolder "$APP" -ov -format UDZO "$DMG"
          ls -lh "$DMG"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          DMG="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/${{ env.APP_NAME }}_0.1.0_aarch64.dmg"
          gh release create "$TAG" --draft --title "${{ env.APP_NAME }} $TAG" --notes "See the assets below to download the installer." 2>/dev/null || true
          gh release upload "$TAG" "$DMG" --clobber

  # ─── macOS Intel (x86_64) ────────────────────────────────
  build-macos-intel:
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON('["all","macos","macos-intel"]'), github.event.inputs.build_targets)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (x86_64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri
        run: npm run tauri build -- --target x86_64-apple-darwin

      - name: Patch ATS & codesign & repackage
        run: |
          APP="src-tauri/target/x86_64-apple-darwin/release/bundle/macos/${{ env.APP_NAME }}.app"
          PLIST="$APP/Contents/Info.plist"
          echo "=== Patching ATS in $PLIST ==="
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$PLIST"
          echo "=== Signing $APP ==="
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          echo "=== Re-creating DMG ==="
          DMG="src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/${{ env.APP_NAME }}_0.1.0_x64.dmg"
          rm -f "$DMG"
          hdiutil create -volname "${{ env.APP_NAME }}" -srcfolder "$APP" -ov -format UDZO "$DMG"
          ls -lh "$DMG"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          DMG="src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/${{ env.APP_NAME }}_0.1.0_x64.dmg"
          gh release create "$TAG" --draft --title "${{ env.APP_NAME }} $TAG" --notes "See the assets below to download the installer." 2>/dev/null || true
          gh release upload "$TAG" "$DMG" --clobber
