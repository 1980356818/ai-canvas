[package]
name = "ai-canvas"
version = "1.1.8"
edition = "2021"

[lib]
name = "ai_canvas_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
# 跨平台 TLS 一致性：rustls-tls-native-roots
#   - native-tls 在 macOS 上 = SecureTransport (Apple 自 10.15 已 deprecated)，
#     在 Windows 上 = SChannel；两端行为分裂，是 Mac 闪退/Win 不复现的主因。
#   - rustls 是纯 Rust，三端行为完全一致；native-roots 复用系统 CA 信任链。
# 详见 docs/性能与IPC规范.md §11.1。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream", "http2", "multipart"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
chrono = "0.4"
tauri-plugin-clipboard-manager = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["time", "sync"] }
# ffmpeg-sidecar: 视频抽帧用。不走 C/C++ binding，直接调编译好的 ffmpeg 二进制 —
# Windows/macOS/Linux 三端零 C 编译依赖，首次使用时 auto_download() 拉到 cache。
ffmpeg-sidecar = "2"

[dev-dependencies]
# upload_remote 单测要写临时文件并验 sha256
tempfile = "3"
# 仅 `cargo test` 用,故意比 [dependencies] 多 macros + rt-multi-thread:
#   - macros        — 让 `#[tokio::test]` 可用
#   - rt-multi-thread — 让 `spawn_blocking` 真正起一个独立线程跑(单测验
#                       run_blocking 不会阻塞 runtime,见 commands/util.rs)
#
# **不要把这两个 feature 加到 [dependencies]**:
#   - 生产用 tauri 自带的 async runtime,自起一个 multi-thread tokio 会
#     双 runtime 资源浪费 + 复杂化 spawn_blocking 的执行环境
#   - 任何 `#[tokio::main]` / 显式 `Runtime::new()` 在生产代码里都是错的
#
# Cargo 对 dev-deps feature 是「test build 时合并」,release build 不会拿到
# rt-multi-thread —— 这就是我们要的隔离。
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
# 关键诊断保留：
#   - panic = "unwind"：让 panic 能被 set_hook 捕获，写出 backtrace 而不是直接 SIGABRT。
#     旧值 "abort" 会让任何漏网的 unwrap/expect 直接闪退、且不留任何线索。
#   - strip = "debuginfo"：保留 symbol table（行号不带），backtrace 能显示函数名，
#     而不是一堆 `<unknown>`；bundle 体积影响 < 1MB。
# 详见 docs/性能与IPC规范.md §11.2。
strip = "debuginfo"
lto = true
codegen-units = 1
panic = "unwind"
opt-level = "z"
