[package]
name = "ai-canvas"
version = "1.4.0"
edition = "2021"

[lib]
name = "ai_canvas_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
# 跨平台 TLS 一致性 + 信任根自带（rustls-tls-webpki-roots）
#   - native-tls 在 macOS 上 = SecureTransport (Apple 自 10.15 已 deprecated)，
#     在 Windows 上 = SChannel；两端行为分裂，是 Mac 闪退/Win 不复现的主因。
#   - rustls 是纯 Rust，三端行为完全一致。
#   - 信任根**必须用 webpki-roots（编译期内置 Mozilla 根集），不能用 native-roots**：
#     native-roots 只信任目标机器 Windows 证书库，而 Windows 的根证书是「按需下载」
#     (Automatic Root Update)——大量国内机器（全新装机 / LTSC / 装机优化软件关了
#     根更新 / 长期不连 Windows Update）根本没有 Let's Encrypt 的 ISRG Root X1，
#     于是我们服务器（api.jjowo.com 等都是 LE 证书）会被 rustls 判为
#     `invalid peer certificate: UnknownIssuer`——开发机证书库全、复现不了，用户机却必挂。
#     webpki-roots 把根集打进二进制，所有机器一致，不依赖 OS 证书库是否被刷新。
#   - 本应用只连公共 CA 证书的服务端（极境 / 各 provider / COS / CDN），不需要企业自签 CA，
#     因此放弃 native-roots（唯一作用是信任用户侧 MITM 代理的私有 CA）无副作用。
# 详见 docs/性能与IPC规范.md §11.1。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream", "http2", "multipart"] }
base64 = "0.22"
# zip: 项目「导出/导入」(.aicat) 的打包格式。default-features=false 只保留核心
# 读写 + Stored(不压缩)—— 媒体(图/视频)本就是压缩格式,再 Deflate 纯浪费 CPU;
# canvas.json 也用 Stored 即可。关掉默认 feature 顺带避免 bzip2/zstd 的 C 编译依赖,
# 与本仓「零 C 依赖」基调(rustls / ffmpeg-sidecar)一致。详见 commands/transfer.rs。
zip = { version = "2", default-features = false }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
chrono = "0.4"
tauri-plugin-clipboard-manager = "2"
# 自动更新 + 版本切换:
#   - updater 负责拉 manifest、minisign 校验、下载、跨平台安装。
#     普通"检查更新"用 app.updater(),指向 tauri.conf.json 配的 check 端点;
#     "切换到指定版本"用 app.updater_builder().endpoints(vec![...]),
#     端点改成 /api/update/manifest/{id} 让它走同一套验签+安装流程。
#   - process 提供 app.restart(),安装完后用它重启进程。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
sha2 = "0.10"
# net: automation 本地 HTTP 桥 (src/automation/) 用 TcpListener 绑 127.0.0.1。
tokio = { version = "1", features = ["time", "sync", "fs", "io-util", "net"] }
# url 解析:版本切换时用 Url::parse() 拼 manifest 端点,避免拼错字符串。
url = "2"
# axum: 本地自动化桥的 HTTP server (127.0.0.1, 仅本机)。外部 AI 工具 (Claude Code /
# Codex) 经 REST /v1/call 与 MCP /mcp 操控画布。server 只做哑管道:把请求 emit 给前端
# 执行 (与 UI 同一代码路径), 自身不碰业务。详见 src/automation/mod.rs 顶部注释 +
# docs/automation/自动化接口-设计与施工图.md。默认 features 已含 json/http1/tokio。
axum = "0.7"
# ffmpeg-sidecar: 视频抽帧用。不走 C/C++ binding，直接调编译好的 ffmpeg 二进制 —
# Windows/macOS/Linux 三端零 C 编译依赖。1.2.5+ 不再走它的 download_ffmpeg 路径,
# 改用我们自己服务器 + SHA 校验,但 FfmpegCommand / event 解析继续用它。
ffmpeg-sidecar = "2"
# 流式下载 ffmpeg.exe 用,reqwest::Response::bytes_stream() 返 Stream，
# StreamExt::next() 在 futures-util 里。已被 reqwest 间接拉进来,这里显式声明。
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
# upload_remote 单测要写临时文件并验 sha256
tempfile = "3"
# 仅 `cargo test` 用,故意比 [dependencies] 多 macros + rt-multi-thread:
#   - macros        — 让 `#[tokio::test]` 可用
#   - rt-multi-thread — 让 `spawn_blocking` 真正起一个独立线程跑(单测验
#                       run_blocking 不会阻塞 runtime,见 commands/util.rs)
#
# **不要把这两个 feature 加到 [dependencies]**:
#   - 生产用 tauri 自带的 async runtime,自起一个 multi-thread tokio 会
#     双 runtime 资源浪费 + 复杂化 spawn_blocking 的执行环境
#   - 任何 `#[tokio::main]` / 显式 `Runtime::new()` 在生产代码里都是错的
#
# Cargo 对 dev-deps feature 是「test build 时合并」,release build 不会拿到
# rt-multi-thread —— 这就是我们要的隔离。
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# 关闭 WebView2 自带的「密码自动保存 + 通用表单自动填充」(见 lib.rs::disable_webview2_autofill)。
# 应用自己管理登录凭据,内置 Edge 的填表器是第二个抢登录框的人 → 半填 bug。
# 版本对齐 wry/tauri 已引入的 0.38 / 0.61,避免 COM 接口类型重复导致 cast 不兼容。
webview2-com = "0.38"
windows = "0.61"

[profile.release]
# 关键诊断保留：
#   - panic = "unwind"：让 panic 能被 set_hook 捕获，写出 backtrace 而不是直接 SIGABRT。
#     旧值 "abort" 会让任何漏网的 unwrap/expect 直接闪退、且不留任何线索。
#   - strip = "debuginfo"：保留 symbol table（行号不带），backtrace 能显示函数名，
#     而不是一堆 `<unknown>`；bundle 体积影响 < 1MB。
# 详见 docs/性能与IPC规范.md §11.2。
strip = "debuginfo"
lto = true
codegen-units = 1
panic = "unwind"
opt-level = "z"
