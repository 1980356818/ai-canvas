<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI猫</title>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      setTimeout(function () {
        var el = document.getElementById("root");
        if (el && !el.hasChildNodes()) {
          el.innerHTML =
            '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:system-ui;color:#888;gap:12px">' +
            '<p style="font-size:16px;font-weight:600">应用加载失败</p>' +
            '<p style="font-size:13px;max-width:360px;text-align:center">您的系统版本可能过低，AI猫需要 macOS 12 或 Windows 10 及以上版本。<br>请升级系统后重试。</p>' +
            '<button onclick="location.reload()" style="margin-top:8px;padding:6px 20px;border-radius:8px;border:1px solid #ccc;background:#f5f5f5;cursor:pointer;font-size:13px">重新加载</button>' +
            "</div>";
        }
      }, 8000);
    </script>
  </body>
</html>
